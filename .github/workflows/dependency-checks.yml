name: Dependency checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'
  EXPO_NO_TELEMETRY: '1'
jobs:
  kitchen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22 --force
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Tests
        run: yarn test
      - name: Build and bundle
        run: yarn deploy:check
